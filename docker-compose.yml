version: '3.8'

services:
  # ==========================================
  # PostgreSQL Database Service
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: brandflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: brandflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brandflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis Cache & BullMQ Queue Service
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: brandflow-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Node.js Express Backend Service
  # ==========================================
  backend:
    build:
      context: ./backend
      target: development
    container_name: brandflow-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: "postgresql://postgres:postgrespassword2026@postgres:5432/brandflow_db?schema=public"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: "super_secret_access_key_brandflow_2026"
      JWT_REFRESH_SECRET: "super_secret_refresh_key_brandflow_2026"
      CLIENT_URL: "http://localhost:5173"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==========================================
  # React.js Vite Frontend Service
  # ==========================================
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: brandflow-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: "http://localhost:5000/api/v1"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

