name: BrandFlow CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  validate-and-lint:
    name: 🔍 Validate Fullstack Dependencies & Schema
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install & Validate Backend
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/brandflow_ci_db?schema=public"
        run: |
          cd backend
          npm install
          npx prisma validate
          npx prisma generate

      - name: 🎨 Install & Validate Frontend
        env:
          VITE_API_BASE_URL_PROD: "https://c2c-negk.onrender.com/api/v1"
        run: |
          cd frontend
          npm install
          npm run build

  docker-build:
    name: 🐳 Docker Container Build Check
    needs: validate-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: false
          tags: brandflow-backend:test

      - name: 🏗️ Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: false
          tags: brandflow-frontend:test

